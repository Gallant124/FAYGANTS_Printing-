<!DOCTYPE html>
<html>
<head>
    <title>FAYGANTS Login</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#111;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            background:#1c1c1c;
            padding:40px;
            border-radius:15px;
            width:350px;
            box-shadow:0 0 20px rgba(255,0,0,0.3);
        }

        h1{
            color:#ff3333;
            text-align:center;
            margin-bottom:25px;
        }

        label{
            color:white;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:5px;
            margin-bottom:15px;
            border:none;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            background:#ff3333;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
            font-weight:bold;
        }

        button:hover{
            background:#cc0000;
        }

        .brand{
            text-align:center;
            color:#aaa;
            margin-top:15px;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>FAYGANTS</h1>

        <form method="POST">

            <label>Username</label>
            <input type="text" name="username" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="brand">
            Assignment Printing System
        </div>

    </div>

</body>
</html>
